# Fiskr — ressource linguistique : équivalences d'ÉTATS, PROVINCES ET RÉGIONS
#
# Une adresse de fiche listée porte « Crimea » là où le référentiel client
# porte « Crimée » ou « Krym ». Un lieu de naissance porte « CA » là où la
# fiche porte « California ». Aucune métrique de chaîne ne rapproche
# « Bavière » de « Bayern » ni « Donetsk Oblast » de « Donetskaya Oblast ».
#
# Ce fichier couvre en priorité les régions qui portent un enjeu de criblage :
# territoires sous régime de sanctions territoriales (Crimée, oblasts
# ukrainiens occupés), puis les subdivisions les plus fréquentes dans les
# référentiels clients (États américains, provinces canadiennes, Länder,
# régions françaises et italiennes, provinces chinoises).
type: state
label: "États, provinces et régions — codes, exonymes et variantes"
source: "ISO 3166-2 + exonymes usuels. À compléter selon le portefeuille."

groups:
