# Fiskr — ressource linguistique : équivalences de VILLES
#
# Les exonymes sont massifs sur les villes : « Londres » et « London », « Pékin »
# et « Beijing », « Moscou », « Moscow » et « Moskva ». Le lieu de naissance
# d'une fiche listée est écrit dans la langue de la source, celui du client
# dans la langue du référentiel — sans table, ils ne se rejoignent jamais.
