# Fiskr — ressource linguistique : équivalences de PRÉNOMS
#
# Ce que cette ressource apporte et que le moteur ne peut PAS déduire seul :
# les métriques de chaîne (Jaro-Winkler, Damerau-Levenshtein) rattrapent déjà
# une faute de frappe ou une lettre d'écart (Mohammad / Mohammed). Elles ne
# peuvent rien déduire de Henri ≡ Harry, Bill ≡ William ou Jean ≡ Giovanni :
# aucune proximité de chaîne n'existe. C'est une connaissance, elle se déclare.
#
# Trois familles de groupes :
#   1. variantes de translittération (arabe, russe, chinois...) — la même
#      graphie d'origine romanisée différemment selon la source ;
#   2. équivalents inter-langues — le même prénom d'une langue à l'autre ;
#   3. diminutifs et hypocoristiques — usage courant dans les référentiels.
#
# Un groupe = une classe canonique. Deux termes d'un même groupe sont traités
# comme identiques au blocking ET au scoring.
type: given_name
label: "Prénoms — translittérations, équivalents inter-langues et diminutifs"
source: "Fiskr, jeu de départ (usages onomastiques courants). À compléter selon le portefeuille."

