  # ---------- Corée : romanisation révisée (RR) vs usage établi ----------
  # La translittération automatique produit la romanisation révisée officielle
  # (박 -> Bag, 이 -> I, 최 -> Choe) ; les listes de sanctions emploient la
  # graphie consacrée (Park, Lee, Choi). Aucune métrique de chaîne ne franchit
  # Bag ≡ Park : c'est une connaissance, elle se déclare.
