# Fiskr — ressource linguistique : équivalences de PAYS
#
# Un référentiel clients porte souvent le nom du pays en clair ou en français
# (« Allemagne »), là où les listes officielles portent un code ISO (« DE »)
# ou le nom anglais (« Germany »). Sans cette table, l'ajustement géographique
# du scoring conclut à une divergence de pays et abaisse le score — ou pire,
# le blocking par pays place les deux fiches dans des seaux différents.
#
# Chaque groupe rassemble : code ISO 3166-1 alpha-2, alpha-3, nom courant
# anglais et français, nom officiel et exonymes fréquents.
type: country
label: "Pays — codes ISO, noms courants, exonymes"
source: "ISO 3166-1 + exonymes usuels FR/EN/DE/ES."

